<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Gapshap Cafe digital menu — browse the menu, pick your favorites, and show them at the counter." />
    <meta name="theme-color" content="#6F4E37" />
    <title>Gapshap Cafe | Digital Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const savedTheme = localStorage.getItem('gapshap_theme');
          const prefersDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
          const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;

          root.classList.toggle('dark', isDark);
          root.classList.toggle('light', !isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          root.style.backgroundColor = isDark ? '#120f0d' : '#fffaf7';
          localStorage.setItem('gapshap_theme', isDark ? 'dark' : 'light');
        } catch (error) {
          const root = document.documentElement;
          root.classList.add('dark');
          root.classList.remove('light');
          root.style.colorScheme = 'dark';
          root.style.backgroundColor = '#120f0d';
        }
      })();
    </script>
  </head>
  <body class="bg-cream text-brown-dark font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
